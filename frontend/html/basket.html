<html>
    <head>
        <title>Basket</title> 
        <link rel="stylesheet" type="text/css" href="../css/basket.css" /> 
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet"> 
        <script src="../js/basket.js"></script>
    </head>

    <body>
        <div id="header">
            <div id="logo">
                <img src="../images/iBay_Logo.png" alt="Logo"/>
            </div>

            <div id="search-bar">
                <form>
                    <input type="search" placeholder="What are you looking for?" required>
                    <button type="submit">Search</button>
                </form>
            </div>
            <div id="sign-in">
                <img src="../images/placeholder-profile.png" alt="avatar">
            </div>

        </div>

        <div id="categories">
    
        </div>

        <div id="main">
            <div id="order_summary">
                    
                <h2>ORDER SUMMARY</h2>

                <div id="summary_content">
                    <div class="summary_row">
                        <span>PRICE</span>
                        <div class="line"></div>
                    </div>

                    <div class="summary_row">
                        <span>POSTAGE</span>
                        <div class="line"></div>
                    </div>

                    <div class="summary_row">
                        <span>TOTAL</span>
                        <div class="line"></div>
                    </div>
                </div>
                <div id="checkout_button">
                    <a href="checkout.html" class="btn">Go to checkout</a>
                </div>
                
                
            </div>
            <div id ="main_content_right">
                <div id="basket">
                <h2>BASKET</h2>
                </div>

                <div id="more_products">
                    <div class="carousel-wrapper">
                        <button class="carousel-btn" id="prev">&#10094;</button>

                        <div class="carousel-window">
                            <div class="carousel-track" id="track">

                                <div class="card">
                                    <img src="https://picsum.photos/200/200?1" alt="Item 1">
                                    <p>Item 1</p>
                                </div>

                                <div class="card">
                                    <img src="https://picsum.photos/200/200?2" alt="Item 2">
                                    <p>Item 2</p>
                                </div>

                                <div class="card">
                                    <img src="https://picsum.photos/200/200?3" alt="Item 3">
                                    <p>Item 3</p>
                                </div>

                                <div class="card">
                                    <img src="https://picsum.photos/200/200?4" alt="Item 4">
                                    <p>Item 4</p>
                                </div>

                                <div class="card">
                                    <img src="https://picsum.photos/200/200?5" alt="Item 5">
                                    <p>Item 5</p>
                                </div>

                                <div class="card">
                                    <img src="https://picsum.photos/200/200?6" alt="Item 6">
                                    <p>Item 6</p>
                                </div>

                            </div>
                        </div>

                        <button class="carousel-btn" id="next">&#10095;</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="footer">
            <div id="copyright">Copyright © 2026 iBay. All rights reserved</div>
        </div>
    </body>
</html>
