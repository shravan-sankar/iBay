<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iBay – Basket</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/basket.css">
</head>

<body>
    <header id="header" class="basket-header">
        <div id="logo">
            <a href="browse.html" id="logo-link" aria-label="iBay home">
                <img src="../images/iBay_logo.jpg" alt="iBay logo">
            </a>
        </div>

        <div id="search-bar">
            <form id="search-form" role="search">
                <input type="search" name="q" placeholder="What are you looking for?" aria-label="Search products">
                <button type="submit">Search</button>
            </form>
        </div>

        <div id="sign-in">
            <a href="profile.html" aria-label="Your profile">
                <img src="../images/avatar-empty.png" alt="">
            </a>
        </div>
    </header>

    <div id="categories" aria-hidden="true"></div>

    <main id="main">
        <aside id="order_summary" aria-labelledby="order-summary-heading">
            <h2 id="order-summary-heading">Order summary</h2>

            <div id="summary_content">
                <div class="summary_row">
                    <span>Price</span>
                    <div class="summary_amount" id="summary-price">£0.00</div>
                </div>

                <div class="summary_row">
                    <span>Postage</span>
                    <div class="summary_amount" id="summary-postage">£0.00</div>
                </div>

                <div class="summary_row summary_row--total">
                    <span>Total</span>
                    <div class="summary_amount" id="summary-total">£0.00</div>
                </div>
            </div>

            <div id="checkout_button">
                <button type="button" class="btn" id="buy-now-btn">Buy Now</button>
            </div>
        </aside>

        <div id="main_content_right">
            <section id="basket" aria-labelledby="basket-heading">
                <h2 id="basket-heading">Basket</h2>
                <div id="basket-list" class="basket-list" hidden></div>
                <p class="basket-empty-msg" id="basket-empty-msg">Your basket is empty — browse items to add them here.</p>
            </section>

            <section id="more_products" aria-label="Suggested products">
                <h3 class="more-products-title">You may also like</h3>
                <div class="carousel-wrapper">
                    <button type="button" class="carousel-btn" id="prev" aria-label="Previous suggestions">&#10094;</button>

                    <div class="carousel-window">
                        <div class="carousel-track" id="track"></div>
                    </div>

                    <button type="button" class="carousel-btn" id="next" aria-label="Next suggestions">&#10095;</button>
                </div>
            </section>
        </div>
    </main>

    <footer id="footer">
        <div id="copyright">Copyright © 2026 iBay. All rights reserved</div>
    </footer>

    <script src="../js/basket.js" defer></script>
</body>

</html>
