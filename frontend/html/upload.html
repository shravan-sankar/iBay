<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iBay - Upload</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../css/upload.css">
    <script src="../js/upload.js"></script>
</head>

<body>
    <!-- Header -->
    <div id="header">
        <div id="page_details">
            <div id="logo">
                <a href="browse.html" id="logo-link" aria-label="iBay home">
                    <img src="../images/iBay_Logo.png" alt="Logo"/>
                </a>
            </div>
            <h2>Your listings</h2>
            
        </div>
    </div>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <a href="browse.html">Home</a> &gt;
        <span>Upload</span>
    </div>

    <div id="main">

        <!-- User Info -->
        <div id="user_content">
            <div id="profile_pic">
                <img src="../images/avatar-empty.png" alt="avatar"> 
            </div>
            <div id="account_info">
                <div id="full_name">Account not logged in</div>
                <div id="email"></div>
            </div>
        </div>

        <div id="listing_content">

            <!-- Existing Products Carousel -->
            <div id="existing_items">

                    <h2 class="panel_heading">Active listings</h2>

                <div class="carousel-window">
                    <div class="carousel-track" id="carousel_track"></div>
                </div>

            </div>

            <div id="item_view">

                <!-- No listing is currently being viewed-->
                <div id="no_listing" class="viewing_state active">
                    <div id="listing_instruction">
                        <p>Select existing listing to view or add new one below</p>
                    </div>
                    <button id="add_listing">Add new listing</button>
                </div>

                <!-- Viewing existing listing -->
                <div id="existing_listing" class="viewing_state">
                    <h2 class="panel_heading">Listing details</h2>

                    <input id="view_itemName" class="listing_title" type="text" disabled>
                    <p class="field-error" id="view_title_error"></p>

                    <div id="view_images">
                        <div class="view_image_content">
                            <label for="view_imgUpload1">
                                <div class="imageBox" id="view_img1"></div>
                            </label>
                            <input type="file" id="view_imgUpload1" name="view_imgUpload1" accept="image/*" style="display:none;">
                            <p class="field-error" id="view_upload_1_error"></p>
                        </div>

                        <div class="view_image_content">
                            <label for="view_imgUpload2">
                                <div class="imageBox" id="view_img2"></div>
                            </label>
                            <input type="file" id="view_imgUpload2" name="view_imgUpload2" accept="image/*" style="display:none;">
                            <p class="field-error" id="view_upload_2_error"></p>
                        </div>
                    </div>

                    <!-- Categories -->
                    <div class="radio_options" id="view_categories">
                        <input type="radio" id="v_electronics" name="v_category" value="electronics">
                        <label for="v_electronics">Electronics</label>

                        <input type="radio" id="v_fashion" name="v_category" value="fashion">
                        <label for="v_fashion">Fashion</label>

                        <input type="radio" id="v_home" name="v_category" value="home">
                        <label for="v_home">Home</label>

                        <input type="radio" id="v_sports" name="v_category" value="sports">
                        <label for="v_sports">Sports</label>

                        <input type="radio" id="v_toys" name="v_category" value="toys">
                        <label for="v_toys">Toys</label>
                    </div>
                    <p class="field-error" id="view_category_error"></p>

                    <!-- Condition -->
                    <div class="radio_options section" id="view_condition">
                        <input type="radio" id="v_new" name="v_condition" value="new">
                        <label for="v_new">New</label>

                        <input type="radio" id="v_used" name="v_condition" value="used">
                        <label for="v_used">Used</label>
                    </div>
                    <p class="field-error" id="view_condition_error"></p>
                    <br>

                    <label for="view_desc">Description</label>
                    <textarea id="view_desc" disabled></textarea>
                    <p class="field-error" id="view_desc_error"></p>
                    <br>

                    <div class="prices">
                        <div class="price_content">
                            <div class="price_input">
                                <label for="view_price">Price</label><span>£</span>
                                <input id="view_price" type="number" disabled class="input_line">
                                <p class="field-error" id="view_price_error"></p>
                            </div>
                        </div>

                        <div class="postage_content">
                            <div class="price_input">
                                <label for="view_postage">Postage</label><span>£</span>
                                <input id="view_postage" type="number" disabled class="input_line">
                                <p class="field-error" id="view_postage_error"></p>
                            </div>
                        </div>
                    </div>
                    <br>

                    <div class="submit_feedback">
                        <p class="field-error submission" id="edit_submit_error"></p>
                    </div>
                    <div class="submit_row">
                        <button class="listing_buttons return_btn">Return</button>
                        <button id="edit_listing" class="listing_buttons">Edit listing</button>
                        <button id="save_listing" class="listing_buttons" style="display:none;">Save</button>
                    </div>
                </div>

                <!-- Adding new listing-->
                <div id="adding_listing" class="viewing_state">
                    <h2 class="panel_heading">New listing</h2>
                    
                    <div id="section">
                        <form action="../../backend/upload_product.php" method="POST" enctype="multipart/form-data">
                            
                            <!-- Product Title -->
                            <div id="title_box">
                                <input id="itemName" class="listing_title" type="text" name="itemName" placeholder="Enter listing title...">
                                <p class="field-error" id="title_error"></p>
                            </div>

                            <!-- Image Uploads -->
                            <div id="upload_images">

                                <div id="image_1_content">
                                    <label for="imgUpload1">
                                        <div class="imageBox" id="imageBox1">
                                            <span class="upload-text">Click to insert image</span>
                                        </div>
                                    </label>
                                    <input 
                                        type="file" 
                                        id="imgUpload1" 
                                        name="imgUpload1"
                                        accept="image/*" 
                                        style="display:none;"
                                    >
                                    <p class="field-error" id="upload_1_error"></p>
                                </div>

                                <div id="image_2_content">
                                    <label for="imgUpload2">
                                        <div class="imageBox" id="imageBox2">
                                            <span class="upload-text">Click to insert image</span>
                                        </div>
                                    </label>
                                    <input 
                                        type="file" 
                                        id="imgUpload2" 
                                        name="imgUpload2"
                                        accept="image/*" 
                                        style="display:none;"
                                    >
                                    <p class="field-error" id="upload_2_error"></p>
                                </div>
                            </div>
                            
                            <!-- Radio Options (Product Category + Condition)-->
                            <div class="radio_options">
                                
                                <input type="radio" id="electronics" name="category" value="electronics">
                                <label for="electronics">Electronics</label>

                                <input type="radio" id="fashion" name="category" value="fashion">
                                <label for="fashion">Fashion</label>

                                <input type="radio" id="home" name="category" value="home">
                                <label for="home">Home</label>

                                <input type="radio" id = "sports" name="category" value="sports">
                                <label for="sports">Sports</label>
                                
                                <input type="radio" id="toys" name="category" value="toys">
                                <label for="toys">Toys</label>

                            </div>
                            <p class="field-error" id="category_error"></p>

                            <div class="radio_options section">
                                
                                <input type="radio" id="new" name="condition" value="new">
                                <label for="new">New</label>

                                <input type="radio" id="used" name="condition" value="used">
                                <label for="used">Used</label>

                            </div>
                            <p class="field-error" id="condition_error"></p>
                            
                            <!-- Product Description -->
                            <label for="desc">Description</label><br>
                            <textarea id="desc" type="text" name="desc" placeholder="Describe listing item"></textarea>
                            <p class="field-error" id="desc_error"></p>
                            <br>

                            <!-- Product Price + Postage -->
                            <div class="prices">
                                
                                <div id="price_content">
                                    <div class="price_input">
                                        <label for="price">Price</label><span>£</span>
                                        <input id="price" type="number" name="price" step="0.01" min="0" class="input_line">
                                    </div>
                                    <p class="field-error" id="price_error"></p>
                                </div>
                                
                                <div id="postage_content">
                                    <div class="price_input">
                                        <label for="postage">Postage</label><span>£</span>
                                        <input id="postage" type="number" name="postage" step="0.01" min="0" class="input_line">
                                    </div>
                                    <p class="field-error" id="postage_error"></p>
                                </div>

                            </div>
                            <br>
                            
                            <!-- Form Buttons -->
                            <div class="submit_feedback">
                                <p class="field-error submission" id="submit_error"></p>
                            </div>
                            <div class="submit_row">
                                <button class="listing_buttons return_btn" type="button">Return</button>
                                <button id="clear_listing" class="listing_buttons" type="button">Clear</button>
                                <button id="listing_submit" class="listing_buttons" type="submit">Add listing</button>
                            </div>
                        </form>
                    </div>
                </div>


            </div>

        </div>
    </div> 

    <!-- Footer/Copyright Notice -->
    <footer id="footer">
        <p>&copy; 2026 iBay. All rights reserved.</p>
    </footer>

</body>
