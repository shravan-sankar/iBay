<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<link rel="stylesheet" href="../css/form.css">
</head>

<body>

<main class="auth-container">

<h1>Create an Account</h1>

<form action="../../backend/register.php" method="POST" enctype="multipart/form-data">

<section class="form-section">
<h2>Account Details</h2>

<div class="input-group">
<label for="email">Email address</label>
<input type="email" name="email" id="email" placeholder="Enter your email" required>
</div>

<div class="input-group">
<label for="password">Password</label>
<input type="password" name="password" id="password" placeholder="Enter your password" required>
</div>

<div class="input-group">
<label for="confirm-password">Confirm Password</label>
<input type="password" name="confirm-password" id="confirm-password" placeholder="Confirm your password" required>
</div>

</section>


<section class="form-section">
<h2>Personal Details</h2>

<div class="input-group">
<label for="first_name">Forename</label>
<input type="text" name="first_name" id="first_name" placeholder="Enter your forename" required>
</div>

<div class="input-group">
<label for="last_name">Surname</label>
<input type="text" name="last_name" id="last_name" placeholder="Enter your surname" required>
</div>

<div class="input-group">
<label for="phone">Phone</label>
<input type="tel" name="phone" id="phone" placeholder="Enter your phone number" required>
</div>

<div class="input-group">
<label for="date-of-birth">Date of Birth</label>
<input type="date" name="date_of_birth" id="date-of-birth" required>
</div>

<div class="input-group">
<label for="gender">Gender</label>
<input type="text" name="gender" id="gender" placeholder="Enter your gender">
</div>

</section>


<section class="form-section">
<h2>Address</h2>

<div class="input-group">
<label for="address">Address</label>
<input type="text" name="address" id="address" placeholder="Enter your address" required>
</div>

<div class="input-group">
<label for="city">City</label>
<input type="text" name="city" id="city" required>
</div>

<div class="input-group">
<label for="state">State</label>
<input type="text" name="state" id="state">
</div>

<div class="input-group">
<label for="zip">Postcode</label>
<input type="text" name="zip" id="zip" required>
</div>

<div class="input-group">
<label for="country">Country</label>
<input type="text" name="country" id="country" required>
</div>

</section>


<section class="form-section">
<h2>Profile</h2>

<div class="input-group">
<label for="profile-picture">Profile Picture</label>
<input type="file" name="profile_picture" id="profile-picture">
</div>

<div class="input-group">
<label for="bio">Bio</label>
<textarea name="bio" id="bio" placeholder="Tell us about yourself"></textarea>
</div>

</section>


<div class="checkbox-group">
<input type="checkbox" id="terms" name="terms" required>
<label for="terms">I agree to the Terms of Service</label>
</div>


<button type="submit" class="btn">Register</button>

</form>


<p class="signup">
Already have an account? <a href="login.html">Sign in</a>
</p>

</main>

</body>
</html>
