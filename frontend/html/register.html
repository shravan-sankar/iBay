<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iBay - Register</title>

<link rel="stylesheet" href="../css/register.css">
<link rel="icon" type="image/png" href="../images/favicon.png">
</head>

<body>

<main class="auth-container">
    <div class="logo">
        <img src="../images/iBay_logo.jpg" alt="iBay logo">
    </div>

    <h2>Create an Account</h2>

<form id="register-form" action="../../backend/register.php" method="POST">

<section class="form-section">

<div class="input-group step-gate">
<label for="email">Email address</label>
<input type="email" name="email" id="email"
       placeholder="Enter your email"
       required maxlength="255">
</div>

<div class="input-group step-gate">
<label for="password">Password</label>
<input type="password" name="password" id="password"
       placeholder="Enter your password"
       required minlength="8">
</div>

<div class="input-group step-gate">
<label for="confirm-password">Confirm Password</label>
<input type="password" name="confirm_password" id="confirm-password"
       placeholder="Confirm your password"
       required minlength="8">
</div>

</section>

<div class="checkbox-group step-gate terms-gate">
<input type="checkbox" id="terms" name="terms" required>
<label for="terms">
    I agree to the <a href="terms.html" target="_blank">Terms of Service</a>
</label>
</div>

<!-- ✅ Error message box -->
<p id="error-message" style="color: red; margin-top: 10px;"></p>

<button type="submit" class="btn step-gate submit-gate">Register</button>

</form>

<p class="signup">
Already have an account? <a href="index.html">Sign in</a>
</p>

</main>

<script src="../js/auth.js" defer></script>
</body>
</html>
