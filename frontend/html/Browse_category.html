<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../css/browse_category.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Category</title>
    <script src="../js/browse_category.js" defer></script>
</head>
<body>

        <div id="header">

            <a href="" style="margin: 20px;" id="logout-link" >Log out</a>

            
            <a href="upload.html" id="profile-image-link">
                <img src="../images/avatar-empty.png" alt="Profile" id="profile-image"> 
            </a>

            <a href="basket.html" id="basket-image-link">
                <img src="../images/basket-image.png" alt="Basket" id="basket-image">
            </a>
            
        </div>

        <div id="navigator">
            <h5> <a href="browse.html" id="home-link">Home</a> > Browse</h5>
        </div>


    <div id="page_layout">

        <!-- FILTERS -->
        <form id="filters">

        <h3>Filters</h3>
        
        <h4>Search</h4>
        <div id="search_bar">
            <input type="text" name="search_query" id="search-bar" placeholder="Search for products...">
        </div>
        <h4>Categories</h4>
        <div class="genre-bubble-wrap">
    <label class="genre-bubble">
        <input type="checkbox" name="category[]" value="Fashion">
        <span>Fashion</span>
    </label>

    <label class="genre-bubble">
        <input type="checkbox" name="category[]" value="Electronics">
        <span>Electronics</span>
    </label>

    <label class="genre-bubble">
        <input type="checkbox" name="category[]" value="Home">
        <span>Home</span>
    </label>

    <label class="genre-bubble">
        <input type="checkbox" name="category[]" value="Sports">
        <span>Sports</span>
    </label>

    <label class="genre-bubble">
        <input type="checkbox" name="category[]" value="Toys">
        <span>Toys</span>
    </label>
    
    </div>
        
        <!-- PRICE -->
        <h4>Price</h4>
        <div class="price-slider-container">
            <div class="price-values">
                <span id="min-price-display">£0</span> - <span id="max-price-display">£500+</span>
            </div>

            <div class="range-slider">
                <div class="slider-track"></div>
                
                <input type="range" min="0" max="500" value="0" id="slider-1">
                <input type="range" min="0" max="500" value="500" id="slider-2">
            </div>

            <input type="hidden" name="price_range" id="price-range-input" value="[0, 500]">
        </div>

        <!-- POSTAGE -->
        <h4>Postage</h4>
        <label>
            <input type="checkbox" name="postage[]" value="Free"> Free Postage
        </label><br>

        <label>
            <input type="checkbox" name="postage[]" value="Paid"> Paid Postage
        </label><br>

        <!-- CONDITION -->
        <h4>Condition</h4>
        <label>
            <input type="checkbox" name="item_condition[]" value="new"> New
        </label><br>

        <label>
            <input type="checkbox" name="item_condition[]" value="used"> Used
        </label><br>

        <!-- APPLY BUTTON -->
        <br>
        <button type="submit">Apply Filters</button>

    </form>

            <div id="products-section">
                    <div id="products-container">
                        
                    </div>
            </div>

    </div>

    </body>
</html>
