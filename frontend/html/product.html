<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iBay - Item Details</title>
    <link rel="stylesheet" href="../css/product.css">
</head>
<body>

    <!-- Navigation Bar -->
    <div id="header">
        <a href="browse.html" id="brand-link">
            <img src="../images/iBay_logo.jpg" alt="iBay" id="brand-logo">
        </a>

        <div class="header-actions">
            <a href="basket.html" id="basket-image-link">
                <img src="../images/basket.svg" alt="Basket" id="basket-image">
            </a>

            <a href="upload.html" id="profile-image-link">
                <img src="../images/avatar-empty.png" alt="Profile" id="profile-image">
            </a>
        </div>
    </div>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <a href="browse.html">Home</a> &gt;
        <a href="search.html">Search Results</a> &gt;
        <span>Item Details</span>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="product-page">

        <h1 class="item-title"></h1>
        <p class="item-category">Condition: <span id="item-condition"></span></p>

        <!-- Product Layout -->
        <div class="product-wrapper">

            <!-- Images -->
            <div class="product-images">
                <img id="main-image" src="../images/placeholder.jpg" alt="Item Image" class="main-image">
                <div class="thumbnail-row">
                    <img src="../images/placeholder.jpg" alt="Thumbnail 1" class="thumbnail" onclick="changeImage(this)">
                    <img src="../images/placeholder2.jpg" alt="Thumbnail 2" class="thumbnail" onclick="changeImage(this)">
                </div>
            </div>

            <!-- Right side: price, seller, buttons -->
            <div class="product-info">

                <!-- Price -->
                <div class="price-box">
                    <p class="price">£<span id="item-price"></span></p>
                    <p class="postage">Postage: £<span id="item-postage"></span></p>
                </div>

                <!-- Seller Info -->
                <div class="seller-info">
                    <p>Seller: <a href="#" id="seller-email-header"></a></p>
                </div>

                <!-- Add To Basket Button -->
                <button class="btn-primary" onclick="addToBasket()">Add to Basket</button>

            </div>
            <!-- End product-info -->

        </div>
        <!-- End product-wrapper -->

        <!-- Description -->
        <div class="section">
            <h2>Item Description</h2>
            <p id="item-description"></p>
        </div>

        <!-- Seller Table -->
        <div class="section">
            <h2>Seller Details</h2>
            <table class="seller-table">
                <tr>
                    <td>Email:</td>
                    <td id="seller-email"></td>
                </tr>
                <tr>
                    <td>Member Since:</td>
                    <td id="seller-since"></td>
                </tr>
            </table>
        </div>

    </div>
    <!-- End Main Content -->

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 iBay. All rights reserved.</p>
    </footer>

    <!-- jQuery needed for AJAX calls in product.js -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../js/product.js"></script>

</body>
</html>
